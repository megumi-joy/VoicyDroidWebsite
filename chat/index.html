<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicy Chat</title>
    <meta name="description" content="Chat with Voicy — your AI companion.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        body { overflow: hidden; }
        .chat-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 16px 0;
        }
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .chat-header h2 { font-size: 1.1rem; font-weight: 600; }
        .chat-status {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex; align-items: center; gap: 6px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: msgIn 0.2s ease-out;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg.system {
            align-self: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-style: italic;
        }
        .msg pre {
            background: rgba(0,0,0,0.15);
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin: 6px 0;
        }
        .chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 12px 0 20px;
            border-top: 1px solid var(--border);
        }
        .chat-input-bar input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--text);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-bar input:focus {
            border-color: var(--accent);
        }
        .chat-input-bar button {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 44px; height: 44px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input-bar button:disabled { opacity: 0.4; cursor: default; }
        .chat-input-bar button:hover:not(:disabled) { opacity: 0.85; }
        #mic-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        #mic-btn.recording { background: #ff1744; color: #fff; animation: pulse 1.5s infinite; border-color: #ff1744; }
        
        .settings-btn { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; padding: 0 10px; }
        .settings-panel {
            display: none; padding: 10px; background: var(--surface); border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border);
        }
        .settings-panel input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-top: 5px; }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .typing-indicator.active { display: block; }
        .typing-indicator span {
            animation: blink 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .memory-bar {
            display: flex;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 4px 0;
        }
        .memory-bar span { opacity: 0.7; }
        .error-toast {
            position: fixed;
            bottom: 80px;
            left: 50%; transform: translateX(-50%);
            background: #ff1744;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }
        .error-toast.show { opacity: 1; }
    </style>
</head>
<body data-theme="dark">
    <nav class="chatgpt-nav">
        <a href="../" style="text-decoration:none;color:inherit">
            <div class="logo">VOICY <span class="accent-dot">.</span></div>
        </a>
        <div class="nav-right">
            <div class="chat-status">
                <span id="conn-status" class="status-dot"></span>
                <span id="conn-label">Connecting...</span>
            </div>
            <button id="settings-toggle" class="settings-btn" title="Settings">⚙️</button>
            <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">🌓</button>
        </div>
    </nav>

    <div class="chat-page">
        <div class="chat-header">
            <h2>💬 Chat</h2>
            <div class="memory-bar">
                <span id="mem-wm">WM: –</span>
                <span id="mem-kb">KB: –</span>
                <span id="mem-archive">Archive: –</span>
            </div>
        </div>

        <div class="settings-panel" id="settings-panel">
            <label style="font-size: 0.85rem; color: var(--text-dim);">API Endpoint (VPS or Local PC via ngrok)</label>
            <input type="text" id="api-url" value="https://api.voicydroid.com">
        </div>

        <div class="chat-messages" id="messages"></div>

        <div class="typing-indicator" id="typing">
            <span>●</span><span>●</span><span>●</span> Voicy is thinking...
        </div>

        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Message Voicy..." autocomplete="off">
            <button id="mic-btn" title="Hold to record voice">🎤</button>
            <button id="send-btn" title="Send text">↑</button>
        </div>
    </div>

    <div class="error-toast" id="error-toast"></div>

    <script>
    let API = localStorage.getItem('voicy_api_url') || 'https://api.voicydroid.com';
    let sessionId = localStorage.getItem('voicy_session') || crypto.randomUUID();
    localStorage.setItem('voicy_session', sessionId);

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('chat-input');
    const sendBtn    = document.getElementById('send-btn');
    const micBtn     = document.getElementById('mic-btn');
    const typingEl   = document.getElementById('typing');
    const connDot    = document.getElementById('conn-status');
    const connLabel  = document.getElementById('conn-label');
    const errorToast = document.getElementById('error-toast');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel  = document.getElementById('settings-panel');
    const apiUrlInput    = document.getElementById('api-url');
    
    apiUrlInput.value = API;
    apiUrlInput.addEventListener('change', (e) => {
        API = e.target.value.replace(/\/$/, "");
        localStorage.setItem('voicy_api_url', API);
        connectSSE();
    });

    settingsToggle.addEventListener('click', () => {
        settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
    });

    // Theme
    const theme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const t = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
    });

    // ── SSE Connection ──────────────────────────────────────────────────────
    let sse = null;
    function connectSSE() {
        if (sse) sse.close();
        sse = new EventSource(`${API}/v1/stream?session_id=${sessionId}`);

        sse.onopen = () => {
            connDot.className = 'status-dot online';
            connLabel.textContent = 'Connected';
        };

        sse.addEventListener('message', (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.type === 'chat' && data.role === 'assistant') {
                    addMessage('assistant', data.content);
                }
            } catch {}
        });

        sse.onerror = () => {
            connDot.className = 'status-dot offline';
            connLabel.textContent = 'Reconnecting...';
            setTimeout(connectSSE, 5000);
        };
    }
    connectSSE();

    // ── Chat Logic ──────────────────────────────────────────────────────────
    function addMessage(role, text) {
        typingEl.classList.remove('active');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        // Basic markdown: **bold**, `code`, ```code blocks```
        let html = text
            .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
        div.innerHTML = html;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showError(msg) {
        errorToast.textContent = msg;
        errorToast.classList.add('show');
        setTimeout(() => errorToast.classList.remove('show'), 4000);
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = '';
        addMessage('user', text);
        typingEl.classList.add('active');
        sendBtn.disabled = true;

        try {
            const resp = await fetch(`${API}/v1/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    session_id: sessionId,
                    platform: 'web',
                }),
            });

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                showError(err.detail || `Error ${resp.status}`);
                typingEl.classList.remove('active');
                sendBtn.disabled = false;
                return;
            }

            const data = await resp.json();
            addMessage('assistant', data.response_text);

            // Update memory stats
            if (data.memory_stats) {
                document.getElementById('mem-wm').textContent = `WM: ${data.memory_stats.working_memory}`;
                document.getElementById('mem-kb').textContent = `KB: ${data.memory_stats.kb_entries}`;
                document.getElementById('mem-archive').textContent = `Archive: ${data.memory_stats.archived}`;
            }
        } catch (e) {
            showError('Failed to connect to Voicy API');
            typingEl.classList.remove('active');
        }

        sendBtn.disabled = false;
    }

    // ── Voice Recording Logic ────────────────────────────────────────────────
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                stream.getTracks().forEach(t => t.stop());
                await sendVoice(audioBlob);
            };
            
            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
        } catch (e) {
            showError('Microphone access denied or not supported.');
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
        }
    }

    async function sendVoice(blob) {
        typingEl.classList.add('active');
        micBtn.disabled = true;
        sendBtn.disabled = true;
        
        const formData = new FormData();
        formData.append('file', blob, 'voice.webm');
        formData.append('session_id', sessionId);
        
        try {
            const resp = await fetch(`${API}/process_audio`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer user_web' },
                body: formData
            });
            
            if (!resp.ok) throw new Error('API Error');
            const data = await resp.json();
            
            if (data.transcription) addMessage('user', data.transcription);
            if (data.response) addMessage('assistant', data.response);
            
            if (data.audio_base64) {
                const audio = new Audio("data:audio/wav;base64," + data.audio_base64);
                audio.play();
            }
        } catch (e) {
            showError('Failed to process audio.');
        }
        
        typingEl.classList.remove('active');
        micBtn.disabled = false;
        sendBtn.disabled = false;
    }

    micBtn.addEventListener('mousedown', startRecording);
    micBtn.addEventListener('mouseup', stopRecording);
    micBtn.addEventListener('mouseleave', stopRecording);
    micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

    // ── Event Handlers ──────────────────────────────────────────────────────
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Focus input on load
    inputEl.focus();

    // Health check + memory stats
    async function checkHealth() {
        try {
            const r = await fetch(`${API}/health`);
            if (r.ok) {
                connDot.className = 'status-dot online';
                connLabel.textContent = 'Connected';
            }
        } catch {
            connDot.className = 'status-dot offline';
            connLabel.textContent = 'Offline';
        }
    }
    setInterval(checkHealth, 30000);
    </script>
</body>
</html>
